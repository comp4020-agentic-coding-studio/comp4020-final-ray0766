name: Restore matched Crit 8 image and database
on:
  workflow_dispatch:
    inputs:
      backup_id:
        description: Exact release-backups directory ID; restores its data point and original image
        required: true
        type: string
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  restore:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      BACKUP_ID: ${{ inputs.backup_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Restore existing machine without adding resources
        run: node scripts/release/restore.mjs "$BACKUP_ID"
